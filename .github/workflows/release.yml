name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.2.0)'
        required: true

jobs:
  # ──────────────────────────────────────────────
  # macOS — universal binary (Intel + Apple Silicon)
  # ──────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    environment: build
    permissions:
      contents: write
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [ -z "$VERSION" ]; then VERSION=${{ inputs.tag }}; VERSION=${VERSION#v}; fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > /tmp/tauri.conf.json && mv /tmp/tauri.conf.json src-tauri/tauri.conf.json
          sed -i '' "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2
      - run: bun install

      - name: Import Apple certificate
        if: ${{ env.APPLE_CERTIFICATE != '' }}
        run: |
          CERT=$RUNNER_TEMP/cert.p12
          KC=$RUNNER_TEMP/signing.keychain-db
          echo "$APPLE_CERTIFICATE" | base64 --decode > $CERT
          security create-keychain -p "temp-keychain-password" $KC
          security set-keychain-settings -lut 21600 $KC
          security unlock-keychain -p "temp-keychain-password" $KC
          security import $CERT -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KC
          security set-key-partition-list -S apple-tool:,apple: -s -k "temp-keychain-password" $KC
          security list-keychain -d user -s $KC

      - name: Build (macOS universal)
        run: bun run tauri build --target universal-apple-darwin

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != '' && github.ref_name || inputs.tag }}
          draft: true
          body: |
            ## Punchly ${{ env.VERSION }}

            Time tracker for OpenProject — macOS, Windows, Linux.

            ### Installation
            | Platform | File |
            |---|---|
            | macOS (Intel + Apple Silicon) | `.dmg` |
            | Windows | `.exe` or `.msi` |
            | Linux | `.AppImage` or `.deb` |

            **macOS:** open the `.dmg`, drag to Applications. On first launch go to *System Settings → Privacy & Security → Open Anyway* if Gatekeeper blocks it.
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # ──────────────────────────────────────────────
  # Windows — NSIS installer + MSI
  # ──────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -ne '') { $env:GITHUB_REF_NAME } else { '${{ inputs.tag }}' }
          $version = $tag.TrimStart('v')
          echo "VERSION=$version" >> $env:GITHUB_ENV
          $conf = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json
          (Get-Content src-tauri/Cargo.toml) -replace '^version = ".*"', "version = `"$version`"" | Set-Content src-tauri/Cargo.toml

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: oven-sh/setup-bun@v2
      - run: bun install

      - name: Import Windows certificate
        if: ${{ env.WINDOWS_CERTIFICATE != '' }}
        shell: pwsh
        run: |
          $certPath = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          echo "TAURI_WINDOWS_CERTIFICATE_PATH=$certPath" >> $env:GITHUB_ENV
          echo "TAURI_WINDOWS_CERTIFICATE_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" >> $env:GITHUB_ENV

      - name: Build (Windows)
        run: bun run tauri build

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != '' && github.ref_name || inputs.tag }}
          draft: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # ──────────────────────────────────────────────
  # Linux — AppImage + .deb
  # ──────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [ -z "$VERSION" ]; then VERSION=${{ inputs.tag }}; VERSION=${VERSION#v}; fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > /tmp/tauri.conf.json && mv /tmp/tauri.conf.json src-tauri/tauri.conf.json
          sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxss-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: oven-sh/setup-bun@v2
      - run: bun install

      - name: Build (Linux)
        run: bun run tauri build

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != '' && github.ref_name || inputs.tag }}
          draft: true
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
